name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; let an in-progress deploy finish instead of cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  LEFTHOOK: 0

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  build:
    name: Build
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: ci/checkout-repo
        uses: actions/checkout@v7

      - name: ci/prepare-node-deps
        uses: ./.github/actions/prepare-node-deps

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Build
        run: yarn build
        env:
          # "/pass-card" for a project site, "" for a custom domain.
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
