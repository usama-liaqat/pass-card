pre-commit:
  parallel: true
  commands:
    types:
      glob: "*.{ts,tsx}"
      run: yarn typecheck
    lint:
      glob: "*.{js,ts,jsx,tsx}"
      run: yarn oxlint --fix {staged_files}
      stage_fixed: true
    format:
      glob: "*.{js,ts,jsx,tsx,json,css,md}"
      run: yarn oxfmt --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true

commit-msg:
  commands:
    commitlint:
      run: yarn commitlint --edit {1}
